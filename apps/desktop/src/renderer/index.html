<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Axon</title>
    <style>
      :root {
        --bg: #16181d;
        --panel: #1c1f26;
        --line: #2b303b;
        --text: #d7dae0;
        --dim: #7c8493;
        --accent: #6aa6ff;
        --ok: #5ec27e;
        --warn: #d9a441;
        --err: #e06c75;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex;
        font: 13px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
        background: var(--bg); color: var(--text);
      }
      #root { flex: 1; display: flex; min-width: 0; }

      /* ── 左侧栏 ── */
      aside {
        width: 300px; flex: none; border-right: 1px solid var(--line);
        display: flex; flex-direction: column; background: var(--panel);
      }
      .panel-head {
        padding: 10px 14px 6px; font-size: 11px; letter-spacing: .08em;
        text-transform: uppercase; color: var(--dim);
        display: flex; justify-content: space-between; align-items: center;
      }
      .panel-head + .roles, .panel-head + .tree { padding-top: 2px; }
      .roles { padding: 0 8px 8px; }
      .group-label {
        padding: 6px 6px 2px; font-size: 10px; color: var(--dim);
        text-transform: uppercase; letter-spacing: .05em;
      }
      .role {
        display: flex; justify-content: space-between; align-items: center;
        gap: 6px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
      }
      .role:hover { background: #23272f; }
      .role .meta { min-width: 0; flex: 1; }
      .role .name { font-weight: 500; display: flex; align-items: center; gap: 5px; }
      .role .desc {
        color: var(--dim); font-size: 11px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .role .fork {
        flex: none; font-size: 10px; padding: 1px 6px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--dim);
      }
      .role .fork[data-mode="all"] { color: var(--warn); border-color: #4a3c22; }
      .role-actions { flex: none; display: flex; gap: 2px; opacity: 0; }
      .role:hover .role-actions { opacity: 1; }
      .badge-override {
        font-size: 9px; color: var(--warn); border: 1px solid #4a3c22;
        border-radius: 3px; padding: 0 3px;
      }

      .tree { flex: 1; overflow: auto; padding: 0 8px 8px; }
      .node {
        padding: 6px 8px; border-radius: 6px; cursor: pointer;
        display: flex; align-items: center; gap: 8px;
      }
      .node:hover { background: #23272f; }
      .node.sel { background: #2a3140; }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--dim); }
      .dot[data-s="running"] { background: var(--accent); }
      .dot[data-s="done"] { background: var(--ok); }
      .dot[data-s="failed"] { background: var(--err); }
      .dot[data-s="waiting"], .dot[data-s="interrupted"] { background: var(--warn); }

      /* ── 协作账本（M4 / UX S4）── */
      .mini-select {
        flex: none; width: auto; padding: 1px 4px; font-size: 10px;
        border-radius: 4px; color: var(--dim);
      }
      .ledger {
        flex: 1; min-height: 96px; overflow: auto; padding: 0 8px 8px;
        border-top: 1px solid var(--line);
      }
      .lrec {
        padding: 6px 8px; border-radius: 6px; margin-top: 4px;
        background: #20242c; border-left: 2px solid var(--line);
      }
      .lrec[data-adoption="pending"] { border-left-color: var(--warn); }
      .lrec[data-adoption="adopted"] { border-left-color: var(--ok); }
      .lrec[data-adoption="rejected"] { border-left-color: var(--err); }
      .lrec-line { display: flex; align-items: center; gap: 6px; font-size: 11px; }
      .lrec .act {
        flex: none; padding: 0 5px; border-radius: 3px; font-size: 10px;
        background: #2a3140; color: var(--accent);
      }
      .lrec .act[data-a="fork"] { color: var(--warn); }
      .lrec .act[data-a="handoff"] { color: var(--ok); }
      .lrec .who {
        flex: 1; min-width: 0; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .lrec .st { flex: none; color: var(--dim); font-size: 10px; }
      .lrec .st.open { color: var(--accent); }
      .lrec-sum {
        margin-top: 3px; font-size: 11px; color: var(--dim);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .lrec-foot {
        margin-top: 4px; display: flex; align-items: center; gap: 6px;
        font-size: 10px; color: var(--dim);
      }
      .lrec-act { margin-left: auto; display: flex; gap: 4px; }
      .lrec .note { font-style: italic; }

      /* ── 主区 ── */
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

      /* ── 审批收件箱（M4 / UX S5）── */
      .approval {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 14px; font-size: 12px;
        background: #2e2817; border-bottom: 1px solid #4a3c22; color: var(--warn);
      }
      .approval-main {
        flex: 1; min-width: 0; display: flex; align-items: baseline;
        gap: 8px; overflow: hidden;
      }
      .approval .chain {
        flex: none; font-family: ui-monospace, monospace;
        font-size: 11px; color: var(--dim);
      }
      .approval .msg {
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .approval .more { flex: none; color: var(--dim); }
      .approval-act { flex: none; display: flex; gap: 6px; }
      button.danger { color: var(--err); }
      .budget {
        padding: 7px 14px; font-size: 12px; border-bottom: 1px solid var(--line);
      }
      .budget.warning { background: #2e2817; color: var(--warn); }
      .budget.frozen { background: #301a1d; color: var(--err); }
      .log {
        flex: 1; overflow: auto; padding: 14px;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
      .log div { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
      .log .ts { color: var(--dim); margin-right: 2px; }
      .log .t { color: var(--dim); }
      .log .e { color: var(--err); }
      .log .k { color: var(--accent); }
      .log .w { color: var(--warn); }
      footer { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 8px; }
      footer button.danger { color: var(--err); }

      input, select, textarea {
        flex: 1; background: #12141a; border: 1px solid var(--line);
        color: var(--text); padding: 7px 10px; border-radius: 6px; font: inherit;
        font-family: inherit;
      }
      input:focus, textarea:focus, select:focus {
        outline: none; border-color: var(--accent);
      }
      button {
        background: #2a3140; border: 1px solid var(--line); color: var(--text);
        padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit;
      }
      button:hover { border-color: var(--accent); }
      button:disabled, input:disabled {
        opacity: .5; cursor: not-allowed; border-color: var(--line);
      }
      button.mini { padding: 1px 7px; font-size: 11px; }

      /* ── 轻提示 ── */
      .dim { color: var(--dim); padding: 8px; }
      .issues {
        margin: 6px 2px; padding: 6px 8px; border-radius: 6px;
        background: #2a2022; border: 1px solid #4a2428;
      }
      .issue { color: var(--err); font-size: 11px; padding: 1px 0; }
      .issue b { margin-right: 4px; }

      /* ── 模态 ── */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(8, 10, 14, .6);
        display: flex; align-items: center; justify-content: center; z-index: 10;
      }
      .modal {
        width: 560px; max-height: 84vh; display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        overflow: hidden;
      }
      .modal-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
      }
      .modal-body {
        padding: 14px 16px; overflow: auto; display: flex;
        flex-direction: column; gap: 10px;
      }
      .modal-body label {
        display: flex; flex-direction: column; gap: 4px;
        font-size: 11px; color: var(--dim);
      }
      .form-row { display: flex; gap: 10px; align-items: end; }
      .form-row label { flex: 1; }
      input.narrow { max-width: 90px; }
      .modal-body details { font-size: 12px; }
      .modal-body pre {
        background: #12141a; border: 1px solid var(--line); border-radius: 6px;
        padding: 10px; overflow: auto; max-height: 180px; font-size: 11px;
      }
      .modal-foot {
        display: flex; justify-content: flex-end; gap: 8px;
        padding: 12px 16px; border-top: 1px solid var(--line);
      }
      button.primary { background: #2f4a7a; border-color: #3d5f9e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>

appId: com.axon.desktop
productName: Axon
copyright: Copyright © 2026

# electron-builder 从 dist-staging/ 作为 app 根目录收集产物。
# staging 目录由 scripts/pack.mjs 在构建前准备好：
#   - esbuild 产物（main.mjs / preload.mjs / renderer/）
#   - pi external 包（node_modules/@earendil-works/*，已解引用 bun symlink）
#   - 最小 package.json（main: ./main.mjs）
# 这样彻底规避 bun workspace symlink 逃逸 appDir 的问题。
directories:
  app: dist-staging
  output: dist-pack

# staging 目录是干净的纯文件树，不含任何 symlink，直接打包全部内容。
files:
  - "**/*"

# ESM import 走 Node 原生 loader，不认 asar 虚拟路径——external 包必须全部解包到
# app.asar.unpacked/node_modules/ 下，否则 main.mjs 的顶层 import 在启动时即崩溃。
# 规则：node_modules/** 全部解包（含 undici、openai、typebox 等传递依赖）。
# 之前只列 @earendil-works/**，导致 undici 等被打进 asar，ESM loader 找不到。
asarUnpack:
  - node_modules/**

mac:
  target:
    - target: dmg
      arch: arm64
  icon: apps/desktop/assets/icon.icns
  # 无签名/公证（v0.1 人工分发，见 M7-packaging.md §六.1）
  # 用户安装后需在「系统设置 → 安全性」手动放行，或：
  #   xattr -cr /Applications/Axon.app
  identity: null

# Windows 打包见 M7-packaging.md P-3：正式分发延期，此块先把图标钉死。
# 不配 icon 时 electron-builder 会去找默认 buildResources 目录的 build/icon.ico，
# 本仓库没有该目录 → 静默回落到 Electron 默认图标，所以必须显式指定。
#
# 为什么 icon.ico 和 icon.icns 内容不同：
#   macOS（icns）: squircle 形状 + 四边各留 ~10% 透明边距（Apple HIG 要求）。
#     Dock 会统一剪裁 squircle；系统把所有图标对齐到视觉重心，留白是规范的一部分。
#   Windows（ico）: 透明底 + 拼图本体直接放大到画布 ~92%，去掉 squircle。
#     任务栏不剪裁也不留白；相邻图标（ChatGPT/Excel 等）几乎满幅，留 squircle 会显小。
#   .ico 用混合格式：16–128 走 BMP/DIB、256 走 PNG，与 Windows 自身产出的 ICO 同构，
#   各 DPI 缩放下都清晰。重新生成 icon.ico 时必须从 icon.png 裁拼图 bbox 再缩放，
#   不能直接复用 macOS 版本。
win:
  target:
    - target: nsis
      arch: x64
  icon: apps/desktop/assets/icon.ico

dmg:
  title: "Axon ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

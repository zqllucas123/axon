<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Axon · 首屏 / 空态</title>
<link rel="stylesheet" href="assets/tokens.css" />
<style>
.suggest-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2); max-width:480px; width:100%; margin-top:var(--sp-4); }
.suggest-pill { padding:var(--sp-3) var(--sp-4); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--bg-card); font-size:var(--text-sm); color:var(--text-dim); cursor:pointer; text-align:left; line-height:var(--lh-base); transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease); }
.suggest-pill:hover { background:var(--bg-hover); border-color:var(--n-300); color:var(--text); }
.suggest-pill strong { display:block; color:var(--text); font-weight:500; margin-bottom:2px; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="traffic"><span class="t-close"></span><span class="t-min"></span><span class="t-max"></span></div>
    <div class="app-name">Axon <span class="chevron" style="color:var(--text-muted);font-size:10px">&#x25BE;</span></div>
    <div class="titlebar-spacer"></div>
    <div class="titlebar-actions">
      <button class="icon-btn" title="搜索"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg></button>
      <button class="icon-btn" title="通知"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 2a4.5 4.5 0 0 1 4.5 4.5c0 2.5.7 3.5 1.5 4H2c.8-.5 1.5-1.5 1.5-4A4.5 4.5 0 0 1 8 2z"/><line x1="6.5" y1="14" x2="9.5" y2="14"/></svg></button>
    </div>
  </div>
  <div class="shell">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <div class="nav-item active"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 12 8 4l6 8"/></svg>新建会话</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 5h6M5 8h6M5 11h4"/></svg>会话总览</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10v8H3z"/><path d="M5.5 7h5M5.5 9.5h3"/></svg>收件箱<span style="margin-left:auto"><span class="badge">3</span></span></div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 13V7l5-4 5 4v6z"/><path d="M6 13v-3h4v3M5 7h6"/></svg>预算与用量</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 3v4h4"/></svg>会话恢复</div>
        <div class="nav-item"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="2.2"/><circle cx="11.5" cy="7" r="1.7"/><path d="M2.5 13c.4-2.2 1.7-3.3 3.5-3.3S9.1 10.8 9.5 13M9.5 11c1.8-.8 3.4-.1 4 2"/></svg>团队管理</div>
      </nav>
      <div class="sidebar-section-label">项目</div>
      <div class="sidebar-sessions">
        <div class="session-group">
          <div class="session-group-header"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 4l4 3-4 3"/></svg>axon</div>
          <div class="session-item active"><span class="session-dot run"></span>支付回调幂等改造</div>
          <div class="session-item"><span class="session-dot ok"></span>Electron 打包修复</div>
        </div>
        <div class="session-group">
          <div class="session-group-header"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 4l4 3-4 3"/></svg>kotei</div>
          <div class="session-item"><span class="session-dot wait"></span>API 压测方案</div>
        </div>
        <div class="recents-label">最近</div>
        <div class="recent-item">解决 Git push 到受保护分支被拒绝</div>
        <div class="recent-item">帮我实现一个贪吃蛇游戏</div>
        <div class="recent-item">端口 1420 被占用导致 dev 启动失败</div>
      </div>
    </aside>
    <main class="main">
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 44c-4-2-8-7-8-14a20 20 0 0 1 40 0c0 7-4 12-8 14"/>
          <path d="M24 52h16M32 44v8"/>
          <circle cx="25" cy="30" r="2" fill="currentColor" stroke="none"/>
          <circle cx="39" cy="30" r="2" fill="currentColor" stroke="none"/>
        </svg>
        <div class="empty-headline">你想让 Axon 做什么？</div>
        <div class="empty-sub">描述任务，选择执行方式，让 Agent 团队开始工作</div>
        <div class="suggest-grid">
          <button class="suggest-pill"><strong>修复 Bug</strong>定位并修复代码中的问题</button>
          <button class="suggest-pill"><strong>开发新功能</strong>从需求到可运行代码</button>
          <button class="suggest-pill"><strong>代码审查</strong>分析质量、安全与性能</button>
          <button class="suggest-pill"><strong>重构优化</strong>改善结构不改变行为</button>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="workspace-context" title="工作路径：/Users/lucaszhou/works/prjs/axon">
          <div class="workspace-context-item">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 5.5h4l1.3 1.5h6.7v6.5a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/>
              <path d="M2.5 5.5v-1a1 1 0 0 1 1-1h3l1.3 1.5"/>
            </svg>
            <span class="context-label">axon</span>
          </div>
          <div class="workspace-context-item">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="3.5" width="12" height="9" rx="1.5"/>
              <path d="M5 15h7M8.5 12.5V15"/>
            </svg>
            <span class="context-label">本地</span>
          </div>
          <div class="workspace-context-item">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="4" cy="4" r="1.7"/><circle cx="13" cy="4" r="1.7"/><circle cx="4" cy="13" r="1.7"/>
              <path d="M5.7 4h5.6M4 5.7v5.6"/>
            </svg>
            <span class="context-label">develop</span>
            <span class="context-detail">工作分支</span>
          </div>
          <span style="flex:1"></span>
          <button class="icon-btn" title="切换项目工作区" aria-label="切换项目工作区">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M7.5 2.5v10M2.5 7.5h10"/>
            </svg>
          </button>
        </div>
        <div class="composer">
          <div style="font-size:var(--text-base);color:var(--text-muted);min-height:22px;">描述你的任务…</div>
          <div class="composer-row">
            <button class="icon-btn" title="附加文件"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 8.5l-5 5a4.24 4.24 0 0 1-6-6L7.5 3a2.83 2.83 0 0 1 4 4L6 12.5a1.41 1.41 0 0 1-2-2L9.5 5"/></svg></button>
            <div style="position:relative">
              <button class="composer-tool" type="button" aria-label="执行引擎：Axon" title="执行引擎：Axon" aria-expanded="false" data-popover="engine-popover">
                <img src="assets/robot.svg" alt="" aria-hidden="true">
              </button>
              <div class="tool-popover" id="engine-popover" hidden>
                <div class="tool-popover-title">选择执行引擎</div>
                <button class="tool-option selected"><img src="assets/robot.svg" alt=""><span>Axon</span><span style="margin-left:auto;color:var(--text-muted)">默认</span></button>
                <button class="tool-option"><img src="assets/engine-claude.png" alt=""><span>Claude</span></button>
                <button class="tool-option"><img src="assets/engine-codex.png" alt=""><span>Codex</span></button>
                <button class="tool-option"><span class="engine-mark">H</span><span>Hermes</span></button>
                <button class="tool-option"><img src="assets/engine-opencode.png" alt=""><span>Opencode</span></button>
              </div>
            </div>
            <div style="position:relative">
              <button class="composer-tool" type="button" aria-label="执行模式：Single" title="执行模式：Single" aria-expanded="false" data-popover="team-popover">
                <img src="assets/team.svg" alt="" aria-hidden="true">
              </button>
              <div class="tool-popover" id="team-popover" hidden>
                <div class="tool-popover-title">选择执行模式</div>
                <button class="tool-option selected"><span class="engine-mark">1</span><span>Single</span><span style="margin-left:auto;color:var(--text-muted)">默认</span></button>
                <button class="tool-option"><img src="assets/team.svg" alt=""><span>指定团队</span></button>
                <div style="height:1px;background:var(--line);margin:var(--sp-2) 0"></div>
                <div class="tool-popover-title">已有团队</div>
                <button class="tool-option"><span class="engine-mark">A</span><span>Axon 核心开发组</span></button>
                <button class="tool-option"><span class="engine-mark">P</span><span>支付改造小队</span></button>
                <button class="tool-option"><span class="engine-mark">R</span><span>代码审查组</span></button>
              </div>
            </div>
            <div style="flex:1"></div>
            <button class="send-btn" disabled title="发送"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="13" x2="8" y2="3"/><path d="M4 7l4-4 4 4"/></svg></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  document.querySelectorAll('[data-popover]').forEach((trigger) => {
    trigger.addEventListener('click', () => {
      const popover = document.getElementById(trigger.dataset.popover);
      const open = popover.hasAttribute('hidden');
      document.querySelectorAll('.tool-popover').forEach((item) => item.hidden = true);
      document.querySelectorAll('[data-popover]').forEach((item) => item.setAttribute('aria-expanded', 'false'));
      popover.hidden = !open;
      trigger.setAttribute('aria-expanded', String(open));
    });
  });
  document.querySelectorAll('.tool-option').forEach((option) => {
    option.addEventListener('click', () => {
      const popover = option.closest('.tool-popover');
      popover.querySelectorAll('.tool-option').forEach((item) => item.classList.remove('selected'));
      option.classList.add('selected');
      popover.hidden = true;
      const trigger = popover.parentElement.querySelector('[data-popover]');
      trigger.setAttribute('aria-expanded', 'false');
      const labels = [...option.querySelectorAll('span')].filter((item) => item.textContent !== '默认');
      const value = labels.at(-1);
      if (value) {
        const kind = trigger.dataset.popover.includes('engine') ? '执行引擎' : '执行模式';
        trigger.setAttribute('aria-label', `${kind}：${value.textContent}`);
        trigger.setAttribute('title', `${kind}：${value.textContent}`);
      }
    });
  });
</script>
</body>
</html>
